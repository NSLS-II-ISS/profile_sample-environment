[workspace]
name = "profile-sample-environment"
version = "0.1.0"
description = "ISS sample environment IPython profile and ramping IOC"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
bluesky-base = ">=1.15,<2"
ophyd = ">=1.11.2,<2"
caproto = ">=1.1.1,<2"
numpy = ">=1.26,<3"
ipython = ">=8.30,<10"

[activation.env]
OPHYD_CONTROL_LAYER = "caproto"

[tasks]
ioc = "python -m iocs.ioc_ramping"
ioc-help = "python -m iocs.ioc_ramping --help"

[feature.dev.dependencies]
pytest = ">=8,<10"
ruff = ">=0.14,<1"

[feature.dev.tasks]
test = "python -m pytest"
lint = "ruff check ."
format-check = "ruff format --check iocs sample_environment tests"
check = { depends-on = ["test", "lint", "format-check", "ioc-help"] }

# The archiver uses databroker.v0, retained in databroker 2 with extra dependencies.
[feature.beamline.dependencies]
databroker = ">=2.0.0b68,<3"
numpy = ">=2,<3"
pandas = ">=2.2,<4"
matplotlib = ">=3.8,<4"
pyqt = ">=5.15,<6"
requests = ">=2.32,<3"
setuptools = ">=77"
h5py = ">=3.11,<4"
# Broker event-source support needs the legacy Mongo access API.
pymongo = ">=4.10,<=4.11"
zarr = ">=2.18,<3"

[feature.beamline.pypi-dependencies]
iss-xsample = { path = "../xsample", editable = true }
simple-pid = ">=1,<3"

[feature.beamline.tasks]
start = "python -m sample_environment.launch"
preflight = "python -m sample_environment.launch --check"

[environments]
default = { features = ["dev"] }
beamline = { features = ["beamline"] }
